# OAK-FFC-3P RGBD configuration
# IMX577 (CAM_A) + OV9782 stereo pair (CAM_B/CAM_C)
# Outputs: RGB, Depth, and IMU
/oak:
  ros__parameters:
    pipeline_gen:
      i_nn_type: none
      i_pipeline_type: RGBD
      i_enable_imu: true
    rgb:
      i_publish_topic: true
      i_board_socket_id: 0  # CAM_A - IMX577
      i_fps: 30.0
      i_width: 1920
      i_height: 1080
    stereo:
      i_depth_preset: DEFAULT
      i_left_socket_id: 1   # CAM_B - OV9782 (left)
      i_right_socket_id: 2  # CAM_C - OV9782 (right)
      i_width: 1280
      i_height: 800
      i_fps: 30.0
      i_subpixel: true
      i_lr_check: true
    imu:
      i_batch_report_threshold: 1
      i_max_batch_reports: 10
